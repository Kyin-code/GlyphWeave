<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GlyphWeave 工程包预览（只读）</title>
  <style>
    :root { color-scheme: dark; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d1117; color: #d6ded9; overflow: hidden; }
    #banner { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: 9px 14px; font-weight: 600;
              background: #1b2430; border-bottom: 1px solid #2f3d4a; }
    #banner.ok { background: #14301f; border-bottom-color: #2f6f45; color: #b7f0c6; }
    #banner.reject { background: #3a1518; border-bottom-color: #7a2b30; color: #ffc9cd; }
    #viewport { position: fixed; inset: 38px 0 0 336px; }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    #panels { position: fixed; top: 38px; left: 0; bottom: 0; width: 336px; overflow-y: auto;
              background: #111820; border-right: 1px solid #23303a; padding: 10px 12px 24px; }
    #panels h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #7f97a8; margin: 14px 0 6px; }
    #panels h2:first-child { margin-top: 2px; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 11.5px/1.5 ui-monospace, Consolas, monospace; color: #c3d0cb; }
    label { display: flex; align-items: center; gap: 7px; padding: 3px 0; font-size: 12.5px; }
    input[type=checkbox], input[type=radio] { width: 15px; height: 15px; accent-color: #4f9d69; }
    select, button { background: #1b242c; color: inherit; border: 1px solid #38505e; border-radius: 5px;
                     padding: 5px 9px; font-size: 12.5px; cursor: pointer; }
    button:hover, select:hover { background: #24313b; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #errors { margin-top: 8px; padding: 8px; background: #2a1416; border: 1px solid #6d2a2f; border-radius: 5px;
              color: #ffc9cd; font: 11.5px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
    .hint { color: #8ba0ad; font-size: 11.5px; }
  </style>
</head>
<body>
  <div id="banner" class="banner" data-phase="loading">正在校验导出文件…</div>

  <div id="viewport"><canvas id="canvas"></canvas></div>

  <aside id="panels">
    <h2>预览身份（只读导出）</h2>
    <pre id="identity">（加载中）</pre>

    <h2>保存的 query 与 route</h2>
    <pre id="route">（加载中）</pre>

    <h2>地形显示面</h2>
    <pre id="terrain">（加载中）</pre>
    <div class="row">
      <label><input type="radio" name="terrain" value="engineered" checked> 工程面</label>
      <label><input type="radio" name="terrain" value="natural"> 自然面</label>
      <label><input type="radio" name="terrain" value="baseline"> 基线面</label>
    </div>
    <p class="hint">三种面都来自保存样本，切换只换显示网格，不重算地形、不回写样本。</p>

    <h2>图层（仅控制可见性）</h2>
    <label><input type="checkbox" data-layer="structures" checked> 结构（踏步/踢面/平台）</label>
    <label><input type="checkbox" data-layer="supports" checked> 支柱/支撑件</label>
    <label><input type="checkbox" data-layer="terrain" checked> 地形显示面</label>
    <label><input type="checkbox" data-layer="route" checked> 已保存有向路径</label>
    <label><input type="checkbox" data-layer="ports" checked> 端口</label>
    <label><input type="checkbox" data-layer="obstacles"> 障碍检查层</label>
    <label><input type="checkbox" data-layer="water"> 水域检查层</label>
    <label><input type="checkbox" data-layer="helpers" checked> 坐标轴与地面网格</label>

    <h2>能力声明过滤</h2>
    <div class="row">
      <select id="capability">
        <option value="">不过滤</option>
        <option value="pedestrian">pedestrian</option>
        <option value="wheelchair">wheelchair</option>
        <option value="vehicle">vehicle</option>
      </select>
      <button id="reload">重载场景</button>
    </div>
    <p class="hint">只表示边自己保存的能力声明；切换能力不会重新寻路，也不会改变已保存的 route 状态。</p>

    <h2>选中对象</h2>
    <pre id="pick">（未选中）点击一个踏步、平台或端口</pre>

    <h2>对象计数</h2>
    <pre id="counts">（加载中）</pre>

    <div id="errors" hidden></div>
  </aside>

  <script type="importmap">
    {"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}
  </script>
  <script type="module" src="./engineering-preview.js"></script>
</body>
</html>
