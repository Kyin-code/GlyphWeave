<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GlyphWeave World Preview</title>
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
    body { margin: 0; background: #101413; color: #d7dfd8; overflow: hidden; }
    header { height: 42px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #18201d; border-bottom: 1px solid #33403a; }
    button, select { background: #202b26; color: inherit; border: 1px solid #52645a; padding: 6px 9px; }
    #viewport { position: fixed; inset: 43px 0 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #info { margin-left: auto; font-family: monospace; color: #9eafa3; }
  </style>
</head>
<body>
  <header><strong id="title">GlyphWeave World</strong><button id="strategic">战略图</button><button id="close">2.5D 近景</button><select id="scene"></select><span id="info"></span></header>
  <main id="viewport"><canvas id="map"></canvas></main>
  <script type="module" src="./app.js"></script>
</body>
</html>
