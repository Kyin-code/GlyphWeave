# 道路系统对象（道路变体、桥梁、人行道和渠道）
id = "transport_surface"
kind = "road"
applies_to = ["road-ew", "road-ns", "bridge", "causeway", "sidewalk", "canal"]
tags = ["transport"]

[geometry]
footprint = [8.0, 8.0]
height = 0.5
clearance = 0.0

[environment]
on_ground = false
not_in_water = false
max_slope = 12

[placement]
phase = "road"
priority = 15
attempts = 8
allow_rotate = true
fallback = "move"
